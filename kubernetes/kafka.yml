apiVersion: apps/v1  # Kubernetes API version for Deployment
kind: Deployment  # Create a Kafka Deployment

metadata:
  name: kafka-deployment  # Deployment name

spec:
  replicas: 1  # Maintain one Kafka Pod

  selector:
    matchLabels:
      app: kafka  # Manage Pods with this label

  template:
    metadata:
      labels:
        app: kafka  # Label added to the Kafka Pod

    spec:
      # Allow Kafka to write into the persistent volume
      securityContext:
        fsGroup: 1000

      containers:
        - name: kafka-container  # Container name
          image: apache/kafka:4.3.1  # Official Kafka Docker image

          env:
            - name: KAFKA_NODE_ID  # Unique Kafka node ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES  # Run as broker and controller
              value: broker,controller

            - name: KAFKA_LISTENERS  # Ports Kafka listens on inside the Pod
              value: PLAINTEXT://:9092,CONTROLLER://:9093

            - name: KAFKA_ADVERTISED_LISTENERS  # Address given to Kafka clients
              value: PLAINTEXT://kafka-service:9092

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            # Explicit Kafka topic/message storage directory
            - name: KAFKA_LOG_DIRS
              value: /tmp/kafka-logs

          ports:
            - containerPort: 9092  # Kafka client connection port
            - containerPort: 9093  # Kafka controller port

          # Mount the persistent storage inside Kafka
          volumeMounts:
            - name: kafka-data-storage
              mountPath: /tmp/kafka-logs

      # Make the Kafka PVC available to the Pod
      volumes:
        - name: kafka-data-storage
          persistentVolumeClaim:
            claimName: kafka-data-pvc

---

apiVersion: v1  # Kubernetes API version for Service
kind: Service  # Create a Kafka ClusterIP Service

metadata:
  name: kafka-service  # DNS name used by Spring Boot

spec:
  selector:
    app: kafka  # Send requests to the Kafka Pod

  ports:
    - name: kafka-client
      port: 9092
      targetPort: 9092

  type: ClusterIP