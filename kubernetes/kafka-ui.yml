apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka-ui-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka-ui

  template:
    metadata:
      labels:
        app: kafka-ui

    spec:
      containers:
        - name: kafka-ui-container
          image: provectuslabs/kafka-ui:latest

          ports:
            - containerPort: 8080

          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: kubernetes-kafka

            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka-service:9092

---

apiVersion: v1
kind: Service

metadata:
  name: kafka-ui-service

spec:
  selector:
    app: kafka-ui

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP
#  kubectl port-forward service/kafka-ui-service 8083:8080